name: release

# Publishes to npm with provenance when a v* tag is pushed to the public repository.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    if: github.repository == 'PhilStrub/fervo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag, package.json and CHANGELOG.md name the same version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "[release] tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          grep -qE "^## $version - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "[release] CHANGELOG.md has no dated heading for $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
