[project]
name = "fervo"
version = "0.1.0"
description = "Minimal repo management for agent contributors: claims, a scored frontier and independent judgment on top of git."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
fervo = "fervo.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
